<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Background decorative elements -->
  <circle cx="50" cy="40" r="20" fill="#f8e8d8" opacity="0.5"/>
  <circle cx="350" cy="160" r="15" fill="#c8a060" opacity="0.2"/>
  <circle cx="320" cy="30" r="8" fill="#d8c8c0" opacity="0.4"/>
  
  <!-- Document/CV -->
  <g transform="translate(80, 20)">
    <!-- Paper -->
    <rect x="0" y="0" width="120" height="160" rx="8" fill="white" stroke="#d8c8c0" stroke-width="2"/>
    
    <!-- Header line -->
    <rect x="15" y="20" width="60" height="8" rx="2" fill="#202048"/>
    <rect x="15" y="35" width="40" height="4" rx="1" fill="#d8c8c0"/>
    
    <!-- Content lines -->
    <rect x="15" y="55" width="90" height="4" rx="1" fill="#e8e0d8"/>
    <rect x="15" y="65" width="80" height="4" rx="1" fill="#e8e0d8"/>
    <rect x="15" y="75" width="85" height="4" rx="1" fill="#e8e8e8"/>
    
    <!-- Divider -->
    <rect x="15" y="90" width="90" height="1" fill="#d8c8c0"/>
    
    <!-- More content -->
    <rect x="15" y="100" width="70" height="4" rx="1" fill="#e8e0d8"/>
    <rect x="15" y="110" width="75" height="4" rx="1" fill="#e8e8e8"/>
    <rect x="15" y="120" width="65" height="4" rx="1" fill="#e8e0d8"/>
    
    <!-- Checkmark badge -->
    <circle cx="100" cy="140" r="15" fill="#c8a060"/>
    <path d="M93 140 L98 145 L108 135" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Arrow/send indicator -->
  <g transform="translate(220, 70)">
    <!-- Envelope -->
    <rect x="0" y="0" width="80" height="55" rx="6" fill="#202048"/>
    <path d="M0 0 L40 30 L80 0" stroke="#c8a060" stroke-width="2" fill="none"/>
    
    <!-- Send arrow -->
    <g transform="translate(90, 15)">
      <circle cx="20" cy="20" r="18" fill="#f8e8d8"/>
      <path d="M12 20 L28 20 M22 14 L28 20 L22 26" stroke="#202048" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="60" cy="120" r="3" fill="#c8a060" opacity="0.6"/>
  <circle cx="340" cy="80" r="4" fill="#202048" opacity="0.3"/>
  <circle cx="300" cy="140" r="2" fill="#c8a060" opacity="0.5"/>
</svg>
